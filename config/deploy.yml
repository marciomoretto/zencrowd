service: zencrowd-kamal
image: marciomr/zencrowd

servers:
  web:
    hosts:
      - zencrowd

  job:
    hosts:
      - zencrowd
    cmd: bundle exec sidekiq -C config/sidekiq.yml

proxy:
  ssl: false
  app_port: 3000
  healthcheck:
    path: /up
    interval: 3
    timeout: 10
  run:
    http_port: 8080
    https_port: 8443

deploy_timeout: 120
drain_timeout: 60

registry:
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_LEVEL: info
    RAILS_SERVE_STATIC_FILES: true

    DATABASE_HOST: db
    DATABASE_USER: <%= ENV.fetch("DATABASE_USER") %>
    REDIS_URL: redis://redis:6379/0
    SIDEKIQ_CONCURRENCY: 8
    GEOCODER_TIMEOUT_SECONDS: 12

    SMTP_ADDRESS: <%= ENV.fetch("SMTP_ADDRESS", "smtp.sendgrid.net") %>
    SMTP_PORT: <%= ENV.fetch("SMTP_PORT", "587") %>
    SMTP_DOMAIN: <%= ENV.fetch("SMTP_DOMAIN", "zencrowd.com.br") %>
    SMTP_USERNAME: <%= ENV.fetch("SMTP_USERNAME", "apikey") %>
    P2PNET_THRESHOLD: <%= ENV.fetch("P2PNET_THRESHOLD", "0.25") %>
    P2PNET_MAX_PIXELS: <%= ENV.fetch("P2PNET_MAX_PIXELS", "18000000") %>
    P2PNET_TILE_MAX_PIXELS: <%= ENV.fetch("P2PNET_TILE_MAX_PIXELS", "1500000") %>
    P2PNET_TILE_OVERLAP_PX: <%= ENV.fetch("P2PNET_TILE_OVERLAP_PX", "128") %>
    P2PNET_MIN_TEXTURE: <%= ENV.fetch("P2PNET_MIN_TEXTURE", "12") %>
    P2PNET_MAX_GREEN_FRACTION: <%= ENV.fetch("P2PNET_MAX_GREEN_FRACTION", "0.6") %>
    P2PNET_DEVICE: <%= ENV.fetch("P2PNET_DEVICE", "cpu") %>
    MOSAIC_RENDER_BACKEND: <%= ENV.fetch("MOSAIC_RENDER_BACKEND", "cloud_run") %>
    CLOUD_RUN_RENDER_JOB: <%= ENV.fetch("CLOUD_RUN_RENDER_JOB", "zencrowd-mosaic-render") %>
    MOSAIC_COUNT_BACKEND: <%= ENV.fetch("MOSAIC_COUNT_BACKEND", "cloud_run") %>
    GCP_PROJECT_ID: <%= ENV.fetch("GCP_PROJECT_ID", "zencrowd-contagem") %>
    GCP_REGION: <%= ENV.fetch("GCP_REGION", "southamerica-east1") %>
    GCS_MOSAIC_BUCKET: <%= ENV.fetch("GCS_MOSAIC_BUCKET", "zencrowd-contagem-mosaics") %>
    CLOUD_RUN_COUNT_JOB: <%= ENV.fetch("CLOUD_RUN_COUNT_JOB", "zencrowd-p2pnet-count") %>

  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - DATABASE_PASSWORD
    - ICB_OAUTH
    - SECRET_OAUTH
    - CALLBACK_ID
    - USP_ADMIN_LOGINS
    - SMTP_PASSWORD
    - GCP_CREDENTIALS_BASE64

accessories:
  db:
    image: postgres:15
    host: zencrowd
    port: "5432:5432"
    directories:
      - data:/var/lib/postgresql/data
    env:
      clear:
        POSTGRES_DB: zencrowd_production
        POSTGRES_USER: <%= ENV.fetch("DATABASE_USER") %>
      secret:
        - POSTGRES_PASSWORD

  redis:
    image: redis:7
    host: zencrowd
    port: "6379:6379"
    directories:
      - data:/data

ssh:
  user: deploy

volumes:
  - /opt/zencrowd/storage:/rails/storage

asset_path: /rails/public/assets

aliases:
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f